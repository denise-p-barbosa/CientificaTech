<body>

    <header style="background: #000; padding: 15px; text-align: center; color: white;">
        [SEU MENU AQUI]
    </header>

    <main class="container-mestre">

        <div class="topico-header">
            <p class="breadcrumbs">Matemática > Básica > <span class="destaque">Introdução às funções</span></p>
            <h1>CIntrodução às funções</h1>
            <p class="intro">
                Revisão sobre Introdução às funções
            </p>
        </div>


        <section class="revisao-bloco">
            
            <div class="coluna-visual">
                <div class="slideshow-container">

                    <div class="mySlides fade">
                        <div class="numbertext">1 / 9</div>
                        <div class="zoom-container" onclick="abrirZoom(this)">
                            <img src="img/ConjuntosNu/conjuntoN1.jpg" alt="Resumo: Números Naturais" class="foto-caderno">
                            <div class="zoom-overlay"><i class="fas fa-search-plus"></i> Ampliar Resumo</div>
                        </div>
                    </div>

                    
                    <a class="prev" onclick="plusSlides(-1, this)">&#10094;</a>
                    <a class="next" onclick="plusSlides(1, this)">&#10095;</a>

                </div>
                <p class="legenda-foto">Use as setas para navegar entre os resumos manuscritos.</p>
            </div>


            <div class="coluna-texto">
                


            </div>

        </section>
        </main>

    <div id="modalZoom" class="modal-backdrop" onclick="fecharZoom()">
        <span class="botao-fechar">&times;</span>
        <img class="modal-imagem" id="imgNoModal">
        <div id="modalLegenda"></div>
    </div>

    <script>
        // Slideshow
        document.addEventListener("DOMContentLoaded", function() {
            let slideshows = document.getElementsByClassName("slideshow-container");
            for (let i = 0; i < slideshows.length; i++) { showSlides(1, slideshows[i]); }
        });

        function plusSlides(n, btnElement) {
            let container = btnElement.parentElement;
            let slideIndex = getSlideIndex(container);
            showSlides(slideIndex + n, container);
        }

        function showSlides(n, container) {
            let i;
            let slides = container.getElementsByClassName("mySlides");
            if (n > slides.length) {n = 1}
            if (n < 1) {n = slides.length}
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
                slides[i].classList.remove("active-slide");
            }
            slides[n-1].style.display = "block";
            slides[n-1].classList.add("active-slide");
        }

        function getSlideIndex(container) {
            let slides = container.getElementsByClassName("mySlides");
            for (let i = 0; i < slides.length; i++) {
                if (slides[i].style.display === "block") return i + 1;
            }
            return 1;
        }

        // Zoom
        function abrirZoom(elemento) {
            const modal = document.getElementById("modalZoom");
            const imgModal = document.getElementById("imgNoModal");
            const legenda = document.getElementById("modalLegenda");
            const imgOriginal = elemento.querySelector('img');
            modal.style.display = "flex";
            imgModal.src = imgOriginal.src;
            legenda.innerHTML = imgOriginal.alt;
        }
        function fecharZoom() {
            document.getElementById("modalZoom").style.display = "none";
        }
    </script>

</body>
