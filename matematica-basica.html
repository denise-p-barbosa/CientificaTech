    <script>
    document.addEventListener("DOMContentLoaded", function() {
        
        // 1. Pega os elementos da tela
        const inputBusca = document.getElementById('contentSearchInput');
        const todosCards = document.querySelectorAll('.uni-rev-card');
        const botaoBusca = document.querySelector('.uni-rev-search-btn');

        // Função que faz a mágica acontecer
        function filtrarConteudo() {
            // Pega o que foi digitado, converte para minúsculo e remove acentos
            // Ex: "Cálculo" vira "calculo"
            const termoDigitado = inputBusca.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "");

            let encontrouAlgo = false;

            todosCards.forEach(card => {
                // Pega o título dentro do card (h3)
                const tituloOriginal = card.querySelector('h3').innerText;
                
                // Limpa o título também (minúsculo e sem acento) para comparar
                const tituloLimpo = tituloOriginal.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "");

                // Verifica se o termo digitado está dentro do título
                if (tituloLimpo.includes(termoDigitado)) {
                    card.style.display = "flex"; // Mostra o card
                    encontrouAlgo = true;
                } else {
                    card.style.display = "none"; // Esconde o card
                }
            });

            // (Opcional) Aqui você poderia mostrar uma mensagem "Nenhum resultado" se encontrouAlgo for false
        }

        // 2. Executa a função toda vez que o usuário soltar uma tecla
        inputBusca.addEventListener('keyup', filtrarConteudo);

        // 3. Executa também se clicar no botão da lupa (para garantir)
        botaoBusca.addEventListener('click', filtrarConteudo);
        
        // 4. Previne que o formulário recarregue a página se houver enter
        inputBusca.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                filtrarConteudo();
            }
        });

    });
</script>
